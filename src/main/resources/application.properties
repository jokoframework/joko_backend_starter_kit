#
# Configuracion base del starter kit (H2 embebido para demo).
# Reemplazar datasource para PostgreSQL; ver application.properties.example
#

spring.application.name=joko-backend-starter-kit

spring.datasource.url=jdbc:h2:file:~/.joko-starter-kit-db;AUTO_SERVER=true;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=org.h2.Driver

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.context-path=/
server.port=8080

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

joko.authentication.enable=true
joko.secret.mode=BD

joko.security.jwt.issuer=joko-starter-kit
joko.security.jwt.audience=joko-starter-kit
joko.security.storage.type=postgres
joko.security.web.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

logging.file.name=/tmp/joko-starter-kit.log

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
