spring.application.name=joko-backend-starter-kit-test

spring.datasource.url=jdbc:h2:mem:startertest;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

joko.authentication.enable=true
joko.secret.mode=BD
joko.security.jwt.issuer=joko-starter-kit
joko.security.jwt.audience=joko-starter-kit
joko.security.storage.type=postgres
joko.security.web.enabled=true

spring.main.banner-mode=off
logging.level.io.github.jokoframework=INFO
